        // ===== PRNG Implementation =====
        // xmur3 hash function to create seed from string
        function xmur3(str) {
            let h = 1779033703 ^ str.length;
            for(let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = h << 13 | h >>> 19;
            }
            return function() {
                h = Math.imul(h ^ h >>> 16, 2246822507);
                h = Math.imul(h ^ h >>> 13, 3266489909);
                return (h ^= h >>> 16) >>> 0;
            };
        }
        
        // mulberry32 PRNG
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        
        // Initialize PRNG with seed
        function initPRNG(seed) {
            const seedGen = xmur3(seed);
            return mulberry32(seedGen());
        }
        
        // Fisher-Yates shuffle using PRNG
        function shuffleArray(array, rng) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(rng() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
        
        // ===== State Management =====
        let currentSeed = '';
        let isShuffled = false;
        let currentReading = null;
        
        // ===== DOM Elements =====
        const spreadSelect = document.getElementById('spread-select');
        const seedInput = document.getElementById('seed-input');
        const allowReversedCheckbox = document.getElementById('allow-reversed');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const drawBtn = document.getElementById('draw-btn');
        const shareBtn = document.getElementById('share-btn');
        const resultsDiv = document.getElementById('results');
        const cardsDisplay = document.getElementById('cards-display');
        const currentSeedSpan = document.getElementById('current-seed');
        const readingInterpretation = document.getElementById('reading-interpretation');
        const historyList = document.getElementById('history-list');
        const copyNotification = document.getElementById('copy-notification');
        
        // ===== Spread Definitions =====
        const spreads = {
            single: {
                name: '單張牌',
                positions: ['當前狀態']
            },
            three: {
                name: '三張牌',
                positions: ['過去 (Past)', '現在 (Present)', '未來 (Future)']
            }
        };
        
        // ===== Generate Seed =====
        function generateSeed() {
            const timestamp = Date.now();
            const random = Math.floor(Math.random() * 1000000);
            return `${timestamp}-${random}`;
        }
        
        // ===== Shuffle Button Handler =====
        shuffleBtn.addEventListener('click', function() {
            let seed = seedInput.value.trim();
            if (!seed) {
                seed = generateSeed();
                seedInput.value = seed;
            }
            currentSeed = seed;
            isShuffled = true;
            drawBtn.disabled = false;
            
            showNotification('✓ 洗牌完成！種子已設定');
        });
        
        // ===== Draw Cards =====
        function drawCards() {
            const spreadType = spreadSelect.value;
            const spread = spreads[spreadType];
            const numCards = spread.positions.length;
            const allowReversed = allowReversedCheckbox.checked;
            
            // Initialize PRNG with seed
            const rng = initPRNG(currentSeed);
            
            // Shuffle deck
            const shuffledDeck = shuffleArray(majorArcana, rng);
            
            // Draw cards
            const drawnCards = [];
            for (let i = 0; i < numCards; i++) {
                const card = shuffledDeck[i];
                const isReversed = allowReversed && rng() < 0.5;
                drawnCards.push({
                    card: card,
                    position: spread.positions[i],
                    orientation: isReversed ? 'reversed' : 'upright'
                });
            }
            
            return {
                spread: spread.name,
                spreadType: spreadType,
                cards: drawnCards,
                seed: currentSeed,
                allowReversed: allowReversed,
                timestamp: new Date().toISOString()
            };
        }
        
        // ===== Display Results =====
        function displayResults(reading) {
            // Clear previous results
            cardsDisplay.innerHTML = '';
            
            // Display seed
            currentSeedSpan.textContent = reading.seed;
            
            // Display cards
            reading.cards.forEach(cardData => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-result';
                
                const meaning = cardData.orientation === 'upright' 
                    ? cardData.card.upright 
                    : cardData.card.reversed;
                
                const orientationText = cardData.orientation === 'upright' ? '正位' : '逆位';
                const orientationClass = cardData.orientation === 'upright' ? 'upright' : 'reversed';
                
                cardDiv.innerHTML = `
                    <div class="card-position">${cardData.position}</div>
                    <div class="card-name">${cardData.card.name}</div>
                    <div class="card-orientation ${orientationClass}">${orientationText}</div>
                    <div class="card-meaning">${meaning}</div>
                `;
                
                cardsDisplay.appendChild(cardDiv);
            });
            
            // Generate interpretation
            const interpretation = generateInterpretation(reading);
            readingInterpretation.textContent = interpretation;
            
            // Show results
            resultsDiv.classList.add('show');
            shareBtn.style.display = 'inline-block';
            
            // Scroll to results
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        
        // ===== Generate Interpretation =====
        function generateInterpretation(reading) {
            if (reading.spreadType === 'single') {
                const card = reading.cards[0];
                const orientation = card.orientation === 'upright' ? '正位' : '逆位';
                return `你抽到了${orientation}的「${card.card.name}」。${card.orientation === 'upright' ? card.card.upright : card.card.reversed}`;
            } else {
                const past = reading.cards[0];
                const present = reading.cards[1];
                const future = reading.cards[2];
                
                return `過去的「${past.card.name}」顯示了${past.orientation === 'upright' ? '正面的影響' : '需要克服的課題'}。現在的「${present.card.name}」代表當前的狀態與挑戰。未來的「${future.card.name}」指引你前進的方向。這三張牌共同揭示了一段完整的旅程，從過去的經驗，經由當下的抉擇，通往未來的可能性。`;
            }
        }
        
        // ===== Draw Button Handler =====
        drawBtn.addEventListener('click', function() {
            if (!isShuffled) {
                alert('請先點擊「洗牌 / 產生種子」按鈕！');
                return;
            }
            
            currentReading = drawCards();
            displayResults(currentReading);
            saveToHistory(currentReading);
            updateHistoryDisplay();
        });
        
        // ===== Share Button Handler =====
        shareBtn.addEventListener('click', function() {
            if (!currentReading) return;
            
            const params = new URLSearchParams();
            params.set('seed', currentReading.seed);
            params.set('spread', currentReading.spreadType);
            params.set('reversed', currentReading.allowReversed ? '1' : '0');
            
            const shareUrl = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
            
            // Copy to clipboard
            navigator.clipboard.writeText(shareUrl).then(() => {
                showNotification('✓ 分享連結已複製到剪貼簿！');
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = shareUrl;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showNotification('✓ 分享連結已複製到剪貼簿！');
            });
        });
        
        // ===== Show Notification =====
        function showNotification(message) {
            copyNotification.textContent = message;
            copyNotification.classList.add('show');
            setTimeout(() => {
                copyNotification.classList.remove('show');
            }, 3000);
        }
        
        // ===== History Management =====
        function saveToHistory(reading) {
            let history = JSON.parse(localStorage.getItem('tarotHistory') || '[]');
            history.unshift(reading);
            
            // Keep only last 10 readings
            if (history.length > 10) {
                history = history.slice(0, 10);
            }
            
            localStorage.setItem('tarotHistory', JSON.stringify(history));
        }
        
        function loadHistory() {
            return JSON.parse(localStorage.getItem('tarotHistory') || '[]');
        }
        
        function updateHistoryDisplay() {
            const history = loadHistory();
            
            if (history.length === 0) {
                historyList.innerHTML = '<p style="color: #999;">暫無歷史紀錄</p>';
                return;
            }
            
            historyList.innerHTML = '';
            history.forEach((reading, index) => {
                const date = new Date(reading.timestamp);
                const dateStr = date.toLocaleString('zh-TW');
                
                const cardNames = reading.cards.map(c => c.card.name).join(', ');
                
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.setAttribute('tabindex', '0');
                historyItem.innerHTML = `
                    <div class="history-item-title">${reading.spread} - ${cardNames}</div>
                    <div class="history-item-details">
                        種子: ${reading.seed} | 時間: ${dateStr}
                    </div>
                `;
                
                historyItem.addEventListener('click', () => replayReading(reading));
                historyItem.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        replayReading(reading);
                    }
                });
                
                historyList.appendChild(historyItem);
            });
        }
        
        function replayReading(reading) {
            // Set up the controls to match the reading
            seedInput.value = reading.seed;
            spreadSelect.value = reading.spreadType;
            allowReversedCheckbox.checked = reading.allowReversed;
            
            // Set current seed and mark as shuffled
            currentSeed = reading.seed;
            isShuffled = true;
            drawBtn.disabled = false;
            
            // Display the reading
            currentReading = reading;
            displayResults(reading);
            
            showNotification('✓ 已回放歷史占卜');
        }
        
        // ===== URL Parameter Handling =====
        function loadFromURL() {
            const params = new URLSearchParams(window.location.search);
            const seed = params.get('seed');
            const spread = params.get('spread');
            const reversed = params.get('reversed');
            
            if (seed) {
                seedInput.value = seed;
                currentSeed = seed;
            }
            
            if (spread && spreads[spread]) {
                spreadSelect.value = spread;
            }
            
            if (reversed !== null) {
                allowReversedCheckbox.checked = reversed === '1';
            }
            
            // If all parameters are present, auto-shuffle and draw
            if (seed && spread) {
                isShuffled = true;
                drawBtn.disabled = false;
                
                // Auto-draw after a short delay
                setTimeout(() => {
                    drawBtn.click();
                }, 500);
            }
        }
        
        // ===== Keyboard Navigation =====
        document.addEventListener('keydown', function(e) {
            // Alt+S for shuffle
            if (e.altKey && e.key === 's') {
                e.preventDefault();
                shuffleBtn.click();
            }
            // Alt+D for draw
            if (e.altKey && e.key === 'd') {
                e.preventDefault();
                if (!drawBtn.disabled) {
                    drawBtn.click();
                }
            }
        });
        
        // ===== Initialization =====
        document.addEventListener('DOMContentLoaded', function() {
            updateHistoryDisplay();
            loadFromURL();
        });
    </script>
</body>
</html>
